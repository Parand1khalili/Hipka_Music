name: Android verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          # Override the action default, which requests the obsolete "tools" package.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --console=plain
      - name: Run Android lint
        run: ./gradlew :app:lintDebug --stacktrace --console=plain
      - name: Summarize verification results
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from collections import Counter

          lines = []
          results = list(Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'))
          if results:
              totals = Counter()
              for path in results:
                  suite = ET.parse(path).getroot()
                  totals.update({key: int(suite.get(key, 0)) for key in ('tests', 'failures', 'errors', 'skipped')})
              lines.append('Unit tests: ' + ', '.join(f'{key}={value}' for key, value in totals.items()))
          lint = Path('app/build/reports/lint-results-debug.xml')
          if lint.exists():
              counts = Counter(issue.get('severity') for issue in ET.parse(lint).getroot().findall('issue'))
              lines.append(f'Lint: errors={counts["Error"] + counts["Fatal"]}, warnings={counts["Warning"]}')
          for line in lines:
              print(line)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\n'.join(lines) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/testDebugUnitTest/
